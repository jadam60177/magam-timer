name: 타이머 만들기

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'RELEASE_NOTES.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 버전 읽기
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path magam_timer.py -Pattern 'APP_VER = "(.+)"').Matches[0].Groups[1].Value
          "ver=$v" >> $env:GITHUB_OUTPUT

      - name: 도구 설치
        run: python -m pip install pyinstaller==6.11.1 pillow==11.0.0

      - name: 코드 그대로 자가 점검
        shell: pwsh
        run: |
          $env:MAGAM_SELFTEST = "1"
          $env:TIMER_DIR = "$env:RUNNER_TEMP\st1"
          python magam_timer.py
          $code = $LASTEXITCODE
          Get-Content "$env:TIMER_DIR\selftest.json" -Encoding utf8
          if ($code -ne 0) { exit 1 }

      - name: exe 만들기 (파일 하나)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --noupx
          --name MagamTimer --icon icon.ico --version-file version_info.txt
          --add-data "timer_bg;timer_bg" --add-data "RamilRound.ttf;." --add-data "icon.png;."
          magam_timer.py

      - name: exe 자가 점검
        shell: pwsh
        run: |
          $env:MAGAM_SELFTEST = "1"
          $env:TIMER_DIR = "$env:RUNNER_TEMP\st2"
          $p = Start-Process -FilePath "dist\MagamTimer.exe" -PassThru -Wait
          Get-Content "$env:TIMER_DIR\selftest.json" -Encoding utf8
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 폴더판 만들기 (백신이 exe 하나짜리를 막을 때 쓰는 것)
        run: >
          pyinstaller --noconfirm --onedir --windowed --noupx
          --distpath dist_folder --workpath build_folder
          --name MagamTimer --icon icon.ico --version-file version_info.txt
          --add-data "timer_bg;timer_bg" --add-data "RamilRound.ttf;." --add-data "icon.png;."
          magam_timer.py

      - name: 폴더판 압축
        shell: pwsh
        run: Compress-Archive -Path dist_folder\MagamTimer -DestinationPath MagamTimer_folder.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MagamTimer
          path: |
            dist/MagamTimer.exe
            MagamTimer_folder.zip

      - name: 다운로드 페이지에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: 마감의 숲 집필 타이머 v${{ steps.ver.outputs.ver }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/MagamTimer.exe
            MagamTimer_folder.zip
